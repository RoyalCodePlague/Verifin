name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test sales.tests.SaleNumberingTests inventory.tests.PurchaseOrderNumberingTests inventory.tests.ProductBatchTests inventory.tests.SupplierPaymentTests reports.tests.BankReconciliationTests core.test_workflows.ConnectedWorkflowTests.test_authorized_offline_sale_is_applied_once core.test_workflows.ConnectedWorkflowTests.test_partial_offline_sync_reports_only_successful_action_ids core.test_workflows.ConnectedWorkflowTests.test_sale_depletes_earliest_expiring_batches_and_reversal_restores_them core.test_workflows.ConnectedWorkflowTests.test_sale_cannot_consume_expired_batch_stock core.test_workflows.ConnectedWorkflowTests.test_offline_batch_receipt_is_idempotent
